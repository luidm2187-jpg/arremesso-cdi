<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; font-family: Inter, system-ui, "Segoe UI", sans-serif; }
  #wrap { position: relative; width: 100%; height: 600px; border-radius: 14px; overflow: hidden;
          box-shadow: 0 10px 30px rgba(0,0,0,.35); user-select: none; }
  canvas { width: 100%; height: 100%; display: block; cursor: crosshair; outline: none; }
  .barra { position: absolute; display: flex; gap: 6px; align-items: center; }
  .pill { color: #cbd5e1; font-size: 12px; background: rgba(15,23,42,.72); padding: 6px 10px; border-radius: 999px;
          cursor: pointer; border: 0; }
  .pill input { vertical-align: -2px; }
  .seta { font-size: 15px; font-weight: 800; padding: 6px 12px; }
  .seta:active { background: #f97316; color: #111827; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" tabindex="0"></canvas>
  <div class="barra" style="right:12px;top:12px">
    <label class="pill"><input type="checkbox" id="traj" checked> trajetória h(t)</label>
    <label class="pill"><input type="checkbox" id="dicas"> zonas exatas</label>
    <label class="pill"><input type="checkbox" id="som" checked> 🔊 som</label>
    <label class="pill"><input type="checkbox" id="lento"> câmera lenta</label>
  </div>
  <div class="barra" style="left:12px;bottom:12px">
    <button class="pill seta" id="esq" title="Afastar da cesta (←)">◀</button>
    <button class="pill seta" id="dir" title="Aproximar da cesta (→)">▶</button>
    <span class="pill" style="cursor:default">🖱️ suba/desça o mouse (ou ↑ ↓ / rodinha) para mirar · segure o clique e solte para arremessar · ← → anda</span>
  </div>
</div>
<script src="fisica.js"></script>
<script>
// ============ protocolo de componente do Streamlit (sem bibliotecas) ============
const enviar = (type, data = {}) => window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
const devolver = value => enviar("streamlit:setComponentValue", { value, dataType: "json" });

// ============ estado do jogo ============
const V_MIN = 3, V_MAX = 15, D_MIN = 1, D_MAX = 10, A_MIN = 10, A_MAX = 85, PERIODO = 2.2;
const S = {
  v: 7.5, ang: 52, h0: 2, dist: 4.6,
  modo: "mirar",          // mirar → forca → voo → fim
  t0: 0, tForca: 0, sim: null, res: null, lento: false,
  placar: { pts: 0, arr: 0, cestas: 0, seq: 0, melhor: 0 },
  teclas: {}, passo: 0, ultimoEnvio: null, id: 0, agora: 0,
  fx: { aro: null, aroForca: 0, tabela: null, tabelaForca: 0, rede: null }, confete: [],
};
const q = (v, p) => Math.round(v / p) * p;                     // arredonda no passo dos sliders
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t * t * (3 - 2 * t), PI = Math.PI;

window.addEventListener("message", ev => {
  if (!ev.data || ev.data.type !== "streamlit:render") return;
  const a = ev.data.args || {}, chave = JSON.stringify([a.v, a.ang, a.dist, a.h0]);
  S.h0 = a.h0 ?? S.h0;
  if (S.ultimoEnvio === chave || S.modo === "voo") return;     // é o eco do nosso próprio arremesso
  const mudou = S.ultimoArgs !== undefined && S.ultimoArgs !== chave;
  S.ultimoArgs = chave;
  Object.assign(S, { v: a.v ?? S.v, ang: a.ang ?? S.ang, dist: a.dist ?? S.dist });
  if (mudou) arremessar(false);                                 // mexeu nos sliders → mostra o arremesso
});

// ============ câmera ============
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let W = 0, H = 0, s = 1, ox = 0, oy = 0;
const cam = { xmin: -3.1, xmax: 9, ymax: 4.8 };
const X = x => ox + (x - cam.xmin) * s, Y = y => oy + (cam.ymax - y) * s, YMIN = -0.85;
const mundo = (px, py) => [cam.xmin + (px - ox) / s, cam.ymax - (py - oy) / s];
function camera(dt) {
  const g = geometria(S.dist), r = resultado(S.v, S.ang, S.h0, S.dist), voando = S.modo === "voo" || S.modo === "fim";
  const alvo = { xmin: -3.1, xmax: g.poste + 0.9, ymax: voando ? Math.min(9, Math.max(4.8, r.hmax + 0.8)) : 4.8 };
  const k = 1 - Math.exp(-dt * 5);
  for (const c in alvo) cam[c] = lerp(cam[c], alvo[c], k);
  s = Math.min(W / (cam.xmax - cam.xmin), H / (cam.ymax - YMIN));
  ox = (W - (cam.xmax - cam.xmin) * s) / 2; oy = H - (cam.ymax - YMIN) * s;
}

// ============ utilidades de desenho ============
function cap(x1, y1, x2, y2, w, cor) {
  ctx.strokeStyle = cor; ctx.lineWidth = w * s; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2)); ctx.stroke();
}
function ik(ax, ay, bx, by, l1, l2, lado) {
  let dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy);
  d = cl(d, Math.abs(l1 - l2) + 1e-3, l1 + l2 - 1e-3);
  const base = Math.atan2(dy, dx), a = Math.acos((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d)), an = base + lado * a;
  return [ax + l1 * Math.cos(an), ay + l1 * Math.sin(an)];
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function txt(t, x, y, cor, peso = 600, tam = 12, al = "left") {
  ctx.fillStyle = cor; ctx.font = `${peso} ${tam}px Inter,system-ui`; ctx.textAlign = al; ctx.textBaseline = "alphabetic"; ctx.fillText(t, x, y);
}
let semente = 7; const rnd = () => (semente = (semente * 16807) % 2147483647) / 2147483647;
const TORCIDA = Array.from({ length: 900 }, () => [rnd(), rnd(), rnd(), Math.floor(rnd() * 7)]);
const TONS = ["#f97316", "#e2e8f0", "#3b82f6", "#facc15", "#94a3b8", "#ef4444", "#22c55e"];

// ============ cenário ============
function cenario() {
  const g = geometria(S.dist), chao = Y(0);
  let gr = ctx.createLinearGradient(0, 0, 0, chao);
  gr.addColorStop(0, "#020617"); gr.addColorStop(.6, "#0f172a"); gr.addColorStop(1, "#1e293b");
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, chao);
  for (const [fx, fy, fa, c] of TORCIDA) {                               // torcida
    const yy = chao - 40 - fy * (chao * .62);
    ctx.globalAlpha = .05 + fa * .1; ctx.fillStyle = TONS[c];
    ctx.beginPath(); ctx.arc(fx * W, yy, 2.4 + fa * 1.6, 0, 2 * PI); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const [fx, a] of [[.2, .14], [.55, .1], [.85, .14]]) {           // holofotes
    gr = ctx.createRadialGradient(W * fx, 0, 0, W * fx, 0, H * .9);
    gr.addColorStop(0, `rgba(255,248,220,${a})`); gr.addColorStop(1, "rgba(255,248,220,0)");
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  }
  ctx.fillStyle = "#0b1220"; ctx.fillRect(0, Y(.32), W, chao - Y(.32));    // placa de propaganda
  ctx.font = `800 ${Math.max(10, .15 * s)}px Inter,system-ui`; ctx.textBaseline = "middle";
  const ad = "CDI • AP2 • ARREMESSO CALCULADO      ", passo = ctx.measureText(ad).width;
  ctx.fillStyle = "rgba(249,115,22,.5)"; for (let x = 12; x < W; x += passo) ctx.fillText(ad, x, Y(.16));
  gr = ctx.createLinearGradient(0, chao, 0, H); gr.addColorStop(0, "#d4a06a"); gr.addColorStop(1, "#8b5a2b");
  ctx.fillStyle = gr; ctx.fillRect(0, chao, W, H - chao);                // piso
  ctx.strokeStyle = "rgba(90,50,20,.18)"; ctx.lineWidth = 1;
  for (let i = 1; i < 10; i++) { const yy = chao + (H - chao) * Math.pow(i / 10, 1.6); ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(W, yy); ctx.stroke(); }
  for (let x = Math.floor(cam.xmin); x < cam.xmax + 2; x += .7) { ctx.strokeStyle = "rgba(90,50,20,.08)"; ctx.beginPath(); ctx.moveTo(X(x), chao); ctx.lineTo(X(x) - 30, H); ctx.stroke(); }
  // marcas da quadra (relativas ao aro): garrafão, lance livre (4,6 m) e linha de 3 (6,75 m)
  const ll = S.dist - 4.6, l3 = S.dist - 6.75, lf = g.fundo;
  ctx.fillStyle = "rgba(29,78,216,.55)";
  ctx.beginPath(); ctx.moveTo(X(ll), chao); ctx.lineTo(X(lf), chao); ctx.lineTo(X(lf) + 40, H); ctx.lineTo(X(ll) - 30, H); ctx.fill();
  const marca = (x, rot, cor) => {
    ctx.strokeStyle = cor; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(X(x), chao); ctx.lineTo(X(x) - 30, H); ctx.stroke();
    txt(rot, X(x) - 8, chao + 16, cor, 800, 10, "center");
  };
  marca(ll, "LANCE LIVRE", "rgba(255,255,255,.9)"); marca(l3, "3 PONTOS", "rgba(250,204,21,.95)");
  ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(X(lf), chao); ctx.lineTo(X(lf) + 40, H); ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, chao); ctx.lineTo(W, chao); ctx.stroke();
  // estrutura da cesta
  const p = g.poste;
  ctx.fillStyle = "#1e3a8a"; rr(X(p - .45), Y(.65), .9 * s, .65 * s, 8); ctx.fill();
  gr = ctx.createLinearGradient(X(p - .1), 0, X(p + .1), 0); gr.addColorStop(0, "#64748b"); gr.addColorStop(.5, "#cbd5e1"); gr.addColorStop(1, "#475569");
  ctx.fillStyle = gr; ctx.fillRect(X(p - .1), Y(3.35), .2 * s, Y(.6) - Y(3.35));
  ctx.fillStyle = "#1e3a8a"; rr(X(p - .14), Y(1.9), .28 * s, 1.3 * s, 6); ctx.fill();
  ctx.strokeStyle = "#94a3b8"; ctx.lineCap = "round"; ctx.lineWidth = .1 * s;
  ctx.beginPath(); ctx.moveTo(X(p), Y(3.3)); ctx.lineTo(X(g.tabela + .05), Y(3.3)); ctx.stroke();
  ctx.lineWidth = .05 * s; ctx.beginPath(); ctx.moveTo(X(p), Y(2.85)); ctx.lineTo(X(g.tabela + .05), Y(3.3)); ctx.stroke();
  const qt = (S.agora - (S.fx.tabela || -1e9)) / 1000, tremeT = qt < .6 ? 5 * S.fx.tabelaForca * Math.exp(-qt * 9) * Math.sin(qt * 80) : 0;
  const tx = X(g.tabela) + tremeT, tw = Math.max(.07 * s, 4);
  gr = ctx.createLinearGradient(tx, 0, tx + tw, 0); gr.addColorStop(0, "rgba(226,232,240,.95)"); gr.addColorStop(1, "rgba(148,163,184,.6)");
  ctx.fillStyle = gr; ctx.fillRect(tx, Y(3.95), tw, Y(2.9) - Y(3.95));
  ctx.fillStyle = "#f8fafc"; ctx.fillRect(tx - 1, Y(3.95), tw + 2, 3); ctx.fillRect(tx - 1, Y(2.9) - 3, tw + 2, 3);
  ctx.fillStyle = "#ef4444"; ctx.fillRect(tx - 2, Y(3.5), 3, Y(3.05) - Y(3.5));
  if (qt < .25) { ctx.fillStyle = `rgba(255,255,255,${.6 * (1 - qt / .25)})`; ctx.fillRect(tx - 3, Y(3.95), tw + 6, Y(2.9) - Y(3.95)); }
}

// ============ aro, rede e bola ============
function aro(frente) {
  const qa = (S.agora - (S.fx.aro || -1e9)) / 1000, treme = qa < 1 ? 7 * S.fx.aroForca * Math.exp(-qa * 7) * Math.sin(qa * 70) : 0;
  const cx = X(S.dist), cy = Y(FIS.ARO) + treme, rx = FIS.RAIO * s, ry = .055 * s;
  ctx.lineWidth = Math.max(.035 * s, 2.5); ctx.strokeStyle = frente ? "#f97316" : "#c2410c";
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, frente ? 0 : PI, frente ? PI : 2 * PI); ctx.stroke();
  if (!frente) { ctx.strokeStyle = "#9ca3af"; ctx.lineWidth = .03 * s; ctx.beginPath(); ctx.moveTo(cx + rx, cy); ctx.lineTo(X(geometria(S.dist).tabela), cy - 2); ctx.stroke(); }
}
function rede(estica, bal) {
  const n = 12, topo = FIS.ARO, base = FIS.ARO - .45 - .2 * estica, rb = .13 - .04 * estica;
  const P = (i, nv) => { const a = i / n * 2 * PI; return [X(S.dist + lerp(FIS.RAIO, rb, nv) * Math.cos(a) + bal * nv * nv), Y(lerp(topo, base, nv)) + Math.sin(a) * .045 * s * (1 - nv * .4)]; };
  ctx.lineWidth = 1.2; ctx.strokeStyle = "rgba(248,250,252,.85)";
  const nv = [0, .33, .66, 1];
  for (let k = 0; k < 3; k++) for (let i = 0; i < n; i++) {
    const [a1, b1] = P(i, nv[k]), [a2, b2] = P(i + .5, nv[k + 1]), [a3, b3] = P(i - .5, nv[k + 1]);
    ctx.beginPath(); ctx.moveTo(a1, b1); ctx.lineTo(a2, b2); ctx.moveTo(a1, b1); ctx.lineTo(a3, b3); ctx.stroke();
  }
}
const RB = .15;
function bola(x, y, rot) {
  const cx = X(x), cy = Y(y), r = RB * s;
  ctx.save(); ctx.translate(cx, cy);
  const gr = ctx.createRadialGradient(-r * .35, -r * .4, r * .1, 0, 0, r);
  gr.addColorStop(0, "#ffb36b"); gr.addColorStop(.55, "#e8681f"); gr.addColorStop(1, "#9a3a0e");
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, r, 0, 2 * PI); ctx.fill(); ctx.clip();
  let sd = 3; const rn = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  ctx.fillStyle = "rgba(90,30,5,.18)";
  for (let i = 0; i < 60; i++) { ctx.beginPath(); ctx.arc((rn() - .5) * 2 * r, (rn() - .5) * 2 * r, r * .035, 0, 2 * PI); ctx.fill(); }
  ctx.rotate(rot); ctx.strokeStyle = "#1c0a02"; ctx.lineWidth = Math.max(r * .09, 1.3);
  ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(r, 0); ctx.moveTo(0, -r); ctx.lineTo(0, r); ctx.stroke();
  ctx.beginPath(); ctx.arc(-r * 1.55, 0, r * 1.15, -.78, .78); ctx.stroke();
  ctx.beginPath(); ctx.arc(r * 1.55, 0, r * 1.15, PI - .78, PI + .78); ctx.stroke();
  ctx.restore();
}
function sombra(x, y) {
  const alt = Math.max(0, y - RB), a = cl(.45 - alt * .08, .08, .45), w = (RB * 1.1 + alt * .05) * s;
  ctx.fillStyle = `rgba(20,10,0,${a})`; ctx.beginPath(); ctx.ellipse(X(x), Y(0) + 4, w, w * .22, 0, 0, 2 * PI); ctx.fill();
}

// ============ jogador ============
const PELE = "#8d5524", PELE2 = "#6b3e1a", CAMISA = "#1d4ed8", CAMISA2 = "#1e3a8a", PX = -.48, T_PREP = .55, AR = .5;
function corpo(agacha, pulo) {
  const flex = agacha * .22;
  return { quadril: [PX - .02 - agacha * .03, .98 - flex + pulo], ombro: [PX + .02 + agacha * .06, 1.5 - flex * .9 + pulo] };
}
const alturaPulo = () => Math.max(.18, (S.h0 - .12) - 1.5 - .41 + .02);   // pula mais se a soltura é alta
const parabolaPulo = tau => { const tj = tau + .25; return tj > 0 && tj < AR ? alturaPulo() * 4 * (tj / AR) * (1 - tj / AR) : 0; };
function drible(t) {                     // bola quicando: rápida embaixo, lenta em cima
  const ph = (t % .6) / .6;
  return [PX + .34, RB + (.9 - RB) * Math.pow(Math.abs(Math.cos(PI * ph)), .9)];
}
// Pose do arremesso em fases: drible → pegada/agachamento → subida + pulo → soltura no alto → punho caído → pouso
function pose(agora, tau) {
  const P = { agacha: .3, pulo: 0, bola: null, mao: null, guia: null, punho: 0, segura: true }, t = agora / 1000;
  if (tau === null && S.modo === "forca") {                       // carregando: quanto mais força, mais agacha
    const [va, vb] = S.faixa, f = cl((S.v - va) / (vb - va)), k = ease(cl((agora - S.tForca) / 180));
    P.agacha = lerp(.3, .35 + .45 * f, k);
    const G = [PX + .24, corpo(P.agacha, 0).ombro[1] - .36], D = drible(t);
    P.bola = [lerp(D[0], G[0], k), lerp(D[1], G[1], k) + .01 * Math.sin(t * 18)];
  } else if (tau !== null && tau < 0) {                           // subida: bola vai ao ponto de arremesso
    const u = (tau + T_PREP) / T_PREP, dip = .35 + .45 * (S.f0 ?? .5);
    P.pulo = parabolaPulo(tau);
    P.agacha = u < .35 ? lerp(dip, dip + .1, ease(u / .35)) : lerp(dip + .1, 0, ease(cl((u - .35) / .3)));
    const c = corpo(P.agacha, P.pulo), G = [PX + .24, corpo(dip, 0).ombro[1] - .36];
    const SP = [PX + .17, c.ombro[1] + .42], R = [0, S.h0];
    P.bola = u < .6 ? [lerp(G[0], SP[0], ease(u / .6)), lerp(G[1], SP[1], ease(u / .6))]
                    : [lerp(SP[0], R[0], ease((u - .6) / .4)), lerp(SP[1], R[1], ease((u - .6) / .4))];
  } else if (tau !== null) {                                      // depois de soltar: braço esticado e punho caído
    P.segura = false; P.pulo = parabolaPulo(tau);
    const pouso = tau - (AR - .25);
    P.agacha = pouso > 0 ? .12 + .3 * Math.exp(-pouso * 6) : 0;
    const c = corpo(P.agacha, P.pulo), c0 = corpo(0, alturaPulo()), desce = ease(cl((tau - .75) / .5));
    const offM = [-.05 - c0.ombro[0], S.h0 - .12 - c0.ombro[1]], offG = [-.2 - c0.ombro[0], S.h0 - .1 - c0.ombro[1]];
    const repM = [PX + .14, c.ombro[1] - .55], repG = [PX + .02, c.ombro[1] - .58];
    P.mao = [lerp(c.ombro[0] + offM[0], repM[0], desce), lerp(c.ombro[1] + offM[1], repM[1], desce)];
    P.guia = [lerp(c.ombro[0] + offG[0] - .05 * ease(cl(tau / .2)), repG[0], desce), lerp(c.ombro[1] + offG[1] - .1 * ease(cl(tau / .2)), repG[1], desce)];
    P.punho = 1 - desce;
  } else {                                                        // mirando: quicando a bola
    P.segura = false; P.agacha = .3 + .03 * Math.sin(t * 2 * PI / .6); P.bola = drible(t);
    const c = corpo(P.agacha, 0);
    P.mao = [P.bola[0] - .01, Math.max(P.bola[1] + RB * .85, .8)]; P.guia = [PX + .03, c.ombro[1] - .52];
  }
  if (P.segura && P.bola) { P.mao = [P.bola[0] - .05, P.bola[1] - .12]; P.guia = [P.bola[0] - .13, P.bola[1] + .02]; }
  return P;
}
function jogador(P) {
  const { quadril, ombro } = corpo(P.agacha, P.pulo), andar = Math.sin(S.passo) * (S.andando ? .12 : 0);
  const pes = P.pulo > .02 ? [[PX - .07, P.pulo + .03], [PX + .1, P.pulo + .01]] : [[PX - .14 + andar, .06], [PX + .16 - andar, .06]];
  ctx.fillStyle = `rgba(20,10,0,${cl(.35 - P.pulo * .3, .08, .35)})`; ctx.beginPath(); ctx.ellipse(X(PX + .02), Y(0) + 4, (.4 - P.pulo * .2) * s, .07 * s, 0, 0, 2 * PI); ctx.fill();
  const perna = (pe, cor, cs) => {
    const ax = pe[0], ay = pe[1] + .08, [jx, jy] = ik(quadril[0], quadril[1], ax, ay, .46, .46, 1);
    cap(quadril[0], quadril[1], jx, jy, .16, cor); cap(jx, jy, ax, ay, .115, cor);
    cap(quadril[0], quadril[1] + .04, lerp(quadril[0], jx, .6), lerp(quadril[1], jy, .6), .2, cs);
    cap(ax, ay - .02, ax, ay + .08, .1, "#f1f5f9");
    const ponta = P.pulo > .02 ? -.35 : 0;                        // no ar o pé aponta para baixo
    ctx.save(); ctx.translate(X(ax + .06), Y(ay - .04)); ctx.rotate(-ponta);
    ctx.fillStyle = "#f8fafc"; ctx.beginPath(); ctx.ellipse(0, 0, .13 * s, .055 * s, 0, 0, 2 * PI); ctx.fill();
    ctx.fillStyle = "#ea580c"; ctx.fillRect(-.11 * s, -.02 * s, .23 * s, .025 * s); ctx.restore();
  };
  const braco = (m, cor, w, punho = 0) => {
    const [ex, ey] = ik(ombro[0], ombro[1], m[0], m[1], .31, .29, -1);
    cap(ombro[0], ombro[1], ex, ey, w * 1.15, cor); cap(ex, ey, m[0], m[1], w, cor);
    if (punho > .05) {                                             // "pescoço de ganso": punho dobrado após soltar
      const a = Math.atan2(m[1] - ey, m[0] - ex) - 1.7 * punho;
      cap(m[0], m[1], m[0] + .1 * Math.cos(a), m[1] + .1 * Math.sin(a), w * .85, cor);
    } else { ctx.fillStyle = cor; ctx.beginPath(); ctx.arc(X(m[0]), Y(m[1]), w * .62 * s, 0, 2 * PI); ctx.fill(); }
  };
  perna(pes[0], PELE2, CAMISA2); braco(P.guia, PELE2, .08);
  cap(quadril[0], quadril[1] + .05, ombro[0], ombro[1] - .06, .33, CAMISA);
